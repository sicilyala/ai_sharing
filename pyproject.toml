[project]
name = "ai-sharing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.6.0",
    "mypy>=2.3.1",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "scikit-learn>=1.9.1",
]

[tool.uv]
cache-dir = "./.uv-cache"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest]
testpaths = ["test"]
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers", "--tb=short", "--color=yes"]

[tool.ruff]
target-version = "py311"
include = ["src/**/*.py", "test/**/*.py"]

[tool.mypy]
files = ["src", "test"]
explicit_package_bases = true
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
